<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Mermaid Diagnostic</title>
<style>
body { background: #0f0f1a; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
.step { margin: 8px 0; padding: 10px; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 6px; }
.pass { border-color: #4caf50; } .fail { border-color: #f44336; }
.mermaid { background: #1a1a2e; padding: 12px; border-radius: 8px; margin: 8px 0; border: 1px solid #4fc3f7; }
pre { background: #0a0a15; padding: 8px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<h2>🔍 Mermaid Rendering Diagnostic</h2>
<div id="steps"></div>
<h3>Raw output of renderMarkdown:</h3>
<div id="rawOutput"></div>
<h3>Mermaid container:</h3>
<div id="mermaidContainer"></div>

<!-- 加载与 base.html 相同的 CDN 资源 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<!-- 加载本地 mermaid -->
<script src="/static/mermaid.min.js"></script>

<script>
function step(text, ok) {
    var d = document.createElement('div');
    d.className = 'step ' + (ok === true ? 'pass' : ok === false ? 'fail' : '');
    d.textContent = text;
    document.getElementById('steps').appendChild(d);
}

window.addEventListener('load', function() {
    // Step 1: Check all scripts loaded
    step('marked loaded: ' + (typeof marked !== 'undefined'), typeof marked !== 'undefined');
    step('hljs loaded: ' + (typeof hljs !== 'undefined'), typeof hljs !== 'undefined');
    step('mermaid loaded: ' + (typeof mermaid !== 'undefined'), typeof mermaid !== 'undefined');
    
    if (typeof mermaid === 'undefined') {
        step('mermaid.js NOT loaded from /static/mermaid.min.js', false);
        return;
    }
    
    // Step 2: Configure marked exactly like base.html
    marked.setOptions({
        breaks: false,
        gfm: true,
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                try { return hljs.highlight(code, { language: lang }).value; }
                catch(e) {}
            }
            try { return hljs.highlightAuto(code).value; }
            catch(e) {}
            return code;
        }
    });
    step('marked configured', true);
    
    // Step 3: Test renderMarkdown function (copy from base.html)
    function renderMarkdown(md) {
        var lines = md.split('\n');
        var result = [];
        var inGraph = false;
        var graphLines = [];
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var isGraphStart = /^graph\s+(TD|LR|RL|TB|BT)(\s+.*)?$/.test(line);
            var isBlank = /^\s*$/.test(line);
            var isHeader = /^#{1,3}\s/.test(line);
            var isCodeBlock = /^```/.test(line);
            if (inGraph) {
                if (isBlank || isHeader || isCodeBlock) {
                    result.push(''); result.push('```mermaid');
                    result.push.apply(result, graphLines);
                    result.push('```'); result.push('');
                    inGraph = false; graphLines = [];
                    result.push(line);
                } else { graphLines.push(line); }
            } else if (isGraphStart) {
                inGraph = true; graphLines.push(line);
            } else { result.push(line); }
        }
        if (inGraph) {
            result.push(''); result.push('```mermaid');
            result.push.apply(result, graphLines);
            result.push('```'); result.push('');
        }
        var html = marked.parse(result.join('\n') || '');
        html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/gi, function(m, code) {
            return '<div class="mermaid">' + code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').trim() + '</div>';
        });
        return html;
    }
    step('renderMarkdown function defined', true);
    
    // Step 4: Test with sample mermaid graph
    var testMd = 'graph TD\n  A[Web] --> B[Server]\n  B --> C[(DB)]';
    var rendered = renderMarkdown(testMd);
    document.getElementById('rawOutput').innerHTML = '<pre>' + rendered.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>';
    step('renderMarkdown output contains mermaid div: ' + (rendered.indexOf('<div class="mermaid">') >= 0), rendered.indexOf('<div class="mermaid">') >= 0);
    
    // Step 5: Check the extracted mermaid content
    var mermaidDiv = document.createElement('div');
    mermaidDiv.innerHTML = rendered;
    var mermaidBlocks = mermaidDiv.querySelectorAll('.mermaid');
    step('Found ' + mermaidBlocks.length + ' mermaid block(s)', mermaidBlocks.length > 0);
    if (mermaidBlocks.length > 0) {
        var graphDef = mermaidBlocks[0].textContent.trim();
        step('Graph def: ' + graphDef.replace(/\n/g, ' | '), true);
        
        // Step 6: Initialize mermaid
        mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
        step('mermaid initialized', true);
        
        // Step 7: Try mermaid.render
        step('mermaid.render type: ' + typeof mermaid.render, typeof mermaid.render === 'function');
        
        if (typeof mermaid.render === 'function') {
            mermaid.render('diag-svg-1', graphDef).then(function(result) {
                step('render SUCCESS! SVG length: ' + result.svg.length, true);
                document.getElementById('mermaidContainer').innerHTML = result.svg;
            }).catch(function(e) {
                step('render FAILED: ' + e.message, false);
                if (e.hash) step('Error detail: ' + JSON.stringify(e.hash).substring(0, 300), false);
            });
        }
    }
});
</script>
</body>
</html>
