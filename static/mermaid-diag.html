<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mermaid Diagnostic</title>
<style>
body { background:#1a1a2e; color:#e0e0e0; font-family:sans-serif; padding:20px; }
.step { margin:10px 0; padding:12px; background:#0f0f1a; border:1px solid #2a2a4a; border-radius:8px; }
.pass { border-color:#4caf50 !important; }
.fail { border-color:#f44336 !important; }
.mermaid { background:#0f0f1a; padding:12px; border-radius:8px; margin:8px 0; min-height:40px; border:1px dashed #4fc3f7; }
pre { background:#0f0f1a; padding:8px; border-radius:4px; overflow-x:auto; font-size:12px; }
</style>
</head>
<body>
<h2>🔍 Mermaid Diagnostic</h2>
<div id="steps"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/mermaid.min.js"></script>

<script>
function step(text, ok) {
    var d = document.createElement('div');
    d.className = 'step ' + (ok === true ? 'pass' : ok === false ? 'fail' : '');
    d.textContent = text;
    document.getElementById('steps').appendChild(d);
}

window.addEventListener('load', function() {
    // 1. marked
    step('marked loaded: ' + (typeof marked !== 'undefined'), typeof marked !== 'undefined');
    
    // 2. mermaid
    step('mermaid loaded: ' + (typeof mermaid !== 'undefined'), typeof mermaid !== 'undefined');
    
    if (typeof mermaid === 'undefined') {
        step('mermaid NOT loaded - check /static/mermaid.min.js', false);
        return;
    }
    
    // 3. API check
    step('mermaid.initialize exists: ' + (typeof mermaid.initialize), typeof mermaid.initialize === 'function');
    step('mermaid.render exists: ' + (typeof mermaid.render), typeof mermaid.render === 'function');
    
    // 4. Initialize
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
    step('mermaid initialized', true);
    
    // 5. Test render
    var graphDef = 'graph TD\n  A[Web] --> B[Server]\n  B --> C[(DB)]';
    step('Testing render with: ' + graphDef.replace(/\n/g,' | '), true);
    
    mermaid.render('diag-svg-1', graphDef).then(function(result) {
        step('render SUCCESS! SVG length: ' + result.svg.length, true);
        var container = document.createElement('div');
        container.className = 'mermaid';
        container.innerHTML = result.svg;
        document.body.appendChild(container);
    }).catch(function(e) {
        step('render FAILED: ' + e.message, false);
        if (e.hash) {
            step('Error hash: ' + JSON.stringify(e.hash).substring(0,200), false);
        }
    });
});
</script>
</body>
</html>
