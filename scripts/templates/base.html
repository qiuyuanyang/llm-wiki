<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM Wiki{% endblock %}</title>
    <style>
        /* ===== Theme Variables ===== */
        [data-theme="dark"] {
            --bg: #0f0f1a; --bg-card: #1a1a2e; --bg-code: #16213e;
            --bg-header-start: #1a1a2e; --bg-header-end: #16213e;
            --text: #e0e0e0; --text-secondary: #888; --text-tertiary: #aaa; --text-muted: #555;
            --border: #2a2a4a; --border-hover: #3a3a5a;
            --accent: #4fc3f7; --accent-hover: #29b6f6;
            --success: #81c784; --success-hover: #66bb6a;
            --h1-color: var(--accent); --h2-color: var(--success); --h3-color: #ffd54f;
            --badge-medium-text: #333;
            --toggle-bg: #2a2a4a; --toggle-icon: #ffd54f;
            --scrollbar-track: #0f0f1a; --scrollbar-thumb: #2a2a4a;
            --error-text: #ef9a9a; --error-border: #ef9a9a; --error-color: #c62828;
            --processing-bg: #1e1e34; --processing-border: #f9a825;
            --btn-view: #1565c0; --btn-view-hover: #1976d2;
            --btn-delete: #c62828; --btn-delete-hover: #d32f2f;
            --btn-download: #00838f; --btn-download-hover: #0097a7;
            --btn-ingest: #2e7d32; --btn-ingest-hover: #388e3c;
            --btn-reprocess: #6a1b9a; --btn-reprocess-hover: #7b1fa2;
            --toast-success: #2e7d32; --toast-error: #c62828; --toast-info: #1565c0;
        }
        [data-theme="light"] {
            --bg: #f5f7fa; --bg-card: #ffffff; --bg-code: #e8ecf0;
            --bg-header-start: #ffffff; --bg-header-end: #f0f4f8;
            --text: #1a1a2e; --text-secondary: #6b7280; --text-tertiary: #9ca3af; --text-muted: #9ca3af;
            --border: #d0d7de; --border-hover: #a8b4c0;
            --accent: #2563eb; --accent-hover: #1d4ed8;
            --success: #16a34a; --success-hover: #15803d;
            --h1-color: var(--accent); --h2-color: var(--success); --h3-color: #b45309;
            --badge-medium-text: #1a1a2e;
            --toggle-bg: #d0d7de; --toggle-icon: #6b7280;
            --scrollbar-track: #f5f7fa; --scrollbar-thumb: #c0c8d0;
            --error-text: #dc2626; --error-border: #fca5a5; --error-color: #dc2626;
            --processing-bg: #fef3c7; --processing-border: #d97706;
            --btn-view: #1565c0; --btn-view-hover: #1976d2;
            --btn-delete: #dc2626; --btn-delete-hover: #ef4444;
            --btn-download: #00838f; --btn-download-hover: #0097a7;
            --btn-ingest: #16a34a; --btn-ingest-hover: #15803d;
            --btn-reprocess: #7c3aed; --btn-reprocess-hover: #6d28d9;
            --toast-success: #16a34a; --toast-error: #dc2626; --toast-info: #2563eb;
        }

        /* Mermaid zoom controls — theme-aware */
        [data-theme="dark"] .mermaid-zoom-btn {
            background: var(--bg-card); color: var(--accent); border-color: var(--border);
        }
        [data-theme="dark"] .mermaid-zoom-btn:hover { opacity: 1 !important; }
        [data-theme="light"] .mermaid-zoom-btn {
            background: var(--bg-card); color: var(--accent); border-color: var(--border);
        }
        [data-theme="light"] .mermaid-zoom-btn:hover { opacity: 1 !important; }
        .mermaid-error {
            color: var(--text-secondary) !important;
            border-color: var(--accent) !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
        .header {
            background: linear-gradient(135deg, var(--bg-header-start) 0%, var(--bg-header-end) 100%);
            border-bottom: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; z-index: 100;
        }
        .header .container { display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 24px; }
        .logo { font-size: 20px; font-weight: 700; color: var(--accent); text-decoration: none; }
        .logo span { color: var(--success); }
        .nav { display: flex; gap: 24px; }
        .nav a { color: var(--text-tertiary); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .nav a:hover, .nav a.active { color: var(--accent); }
        .theme-toggle {
            background: var(--toggle-bg); border: none; border-radius: 50%;
            width: 36px; height: 36px; cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.1); }
        .card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 20px; margin-bottom: 16px; transition: background 0.3s, border-color 0.3s;
        }
        .card:hover { border-color: var(--border-hover); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-header-end));
            border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center;
        }
        .stat-card .value { font-size: 36px; font-weight: 700; color: var(--accent); }
        .stat-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th {
            background: var(--bg-code); color: var(--accent); font-size: 13px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        td { font-size: 14px; }
        tr:hover td { background: var(--bg-card); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-infrastructure { background: #2e7d32; color: #fff; }
        .badge-source { background: #1565c0; color: #fff; }
        .badge-diagnosis { background: #c62828; color: #fff; }
        .badge-entity { background: #7b1fa2; color: #fff; }
        .badge-concept { background: #f57c00; color: #fff; }
        .badge-query { background: #00838f; color: #fff; }
        .badge-comparison { background: #5d4037; color: #fff; }
        .badge-critical { background: #c62828; color: #fff; }
        .badge-high { background: #e65100; color: #fff; }
        .badge-medium { background: #f9a825; color: var(--badge-medium-text); }
        .badge-low { background: #43a047; color: #fff; }
        .search-box { display: flex; gap: 12px; margin-bottom: 24px; }
        .search-box input {
            flex: 1; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 15px; outline: none;
            transition: background 0.3s, border-color 0.3s;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box button {
            padding: 12px 24px; background: var(--accent); color: var(--bg); border: none;
            border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .search-box button:hover { background: var(--accent-hover); }
        .query-box { margin-bottom: 24px; }
        .query-box textarea {
            width: 100%; min-height: 100px; padding: 16px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text);
            font-size: 15px; font-family: inherit; resize: vertical; outline: none;
            transition: background 0.3s, border-color 0.3s;
        }
        .query-box textarea:focus { border-color: var(--accent); }
        .query-box button {
            margin-top: 12px; padding: 12px 32px; background: var(--success); color: var(--bg);
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .query-box button:hover { background: var(--success-hover); }
        .answer-box {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 24px; margin-top: 24px;
        }
        .answer-box h3 { color: var(--accent); margin-bottom: 16px; }
        .answer-content { line-height: 1.8; }
        .answer-content p { margin-bottom: 12px; }
        .answer-content code { background: var(--bg-code); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .answer-content pre {
            background: var(--bg-code); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0;
        }
        .answer-content pre code { background: none; padding: 0; }
        .source-list { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .source-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: var(--bg-code); border-radius: 6px; margin-bottom: 8px;
        }
        .source-item a { color: var(--accent); text-decoration: none; }
        .source-item a:hover { text-decoration: underline; }
        .source-score { color: var(--text-secondary); font-size: 13px; }
        .page-content {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 32px; line-height: 1.8;
        }
        .page-content h1 { color: var(--h1-color); margin-bottom: 16px; }
        .page-content h2 { color: var(--h2-color); margin: 24px 0 12px; }
        .page-content h3 { color: var(--h3-color); margin: 20px 0 8px; }
        .page-content table { margin: 16px 0; }
        .page-content th { background: var(--bg-code); }
        .page-content td { border-bottom: 1px solid var(--border); }
        .page-content blockquote {
            border-left: 3px solid var(--accent); padding-left: 16px; margin: 16px 0; color: var(--text-tertiary);
        }
        .page-content code { background: var(--bg-code); padding: 2px 6px; border-radius: 4px; }
        .page-content pre {
            background: var(--bg-code); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0;
        }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .spinner {
            display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            text-align: center; padding: 32px 0; color: var(--text-muted); font-size: 13px;
            border-top: 1px solid var(--border); margin-top: 40px;
        }
        @media (max-width: 768px) {
            .header .container { flex-wrap: wrap; gap: 8px; }
            .header-left { gap: 12px; }
            .nav { gap: 12px; flex-wrap: wrap; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-left">
                <a href="/" class="logo">📚 LLM <span>Wiki</span></a>
                <nav class="nav">
                    <a href="/" {% if request.path == '/' %}class="active"{% endif %}>首页</a>
                    <a href="/search" {% if request.path == '/search' %}class="active"{% endif %}>搜索</a>
                    <a href="/query" {% if request.path == '/query' %}class="active"{% endif %}>智能问答</a>
                    <a href="/diagnoses" {% if request.path == '/diagnoses' %}class="active"{% endif %}>故障诊断</a>
                    <a href="/topology" {% if request.path == '/topology' %}class="active"{% endif %}>拓扑图</a>
                    <a href="/upload" {% if request.path == '/upload' %}class="active"{% endif %}>📤 源文档</a>
                </nav>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="切换主题">🌙</button>
        </div>
    </div>

    <div class="container" style="padding-top: 24px; padding-bottom: 24px;">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        LLM Wiki — 基础设施知识库
    </div>

    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
    <script>
        // Configure marked for proper rendering
        marked.setOptions({
            breaks: false,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; }
                    catch (e) {}
                }
                try { return hljs.highlightAuto(code).value; }
                catch (e) {}
                return code;
            }
        });

        // Render markdown helper
        function renderMarkdown(md) {
            // Check if md already contains ```mermaid code blocks
            var hasMermaidBlock = /```\s*mermaid/.test(md);
            if (hasMermaidBlock) {
                // Skip pre-processing, let marked handle existing code blocks directly
                var html = marked.parse(md || '');
                html = html.replace(/<pre><code[^>]*class="[^"]*language-mermaid[^"]*"[^>]*>([\s\S]*?)<\/code><\/pre>/gi, function(m, code) {
                    return '<div class="mermaid">' + code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').trim() + '</div>';
                });
                return html;
            }

            // Pre-process: detect standalone mermaid graphs (without code fences)
            var lines = md.split('\n');
            var result = [];
            var inGraph = false;
            var graphLines = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var isGraphStart = /^graph\s+(TD|LR|RL|TB|BT)(\s+.*)?$/.test(line);
                var isBlank = /^\s*$/.test(line);
                var isHeader = /^#{1,3}\s/.test(line);
                var isCodeBlock = /^```/.test(line);
                
                if (inGraph) {
                    if (isBlank || isHeader || isCodeBlock) {
                        // End of graph block - wrap in mermaid code block with blank lines
                        result.push('');
                        result.push('```mermaid');
                        result.push.apply(result, graphLines);
                        result.push('```');
                        result.push('');
                        inGraph = false;
                        graphLines = [];
                        result.push(line);
                    } else {
                        graphLines.push(line);
                    }
                } else if (isGraphStart) {
                    inGraph = true;
                    graphLines.push(line);
                } else {
                    result.push(line);
                }
            }
            if (inGraph) {
                result.push('');
                result.push('```mermaid');
                result.push.apply(result, graphLines);
                result.push('```');
                result.push('');
            }
            var html = marked.parse(result.join('\n') || '');
            // Handle mermaid code blocks
            html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/gi, function(m, code) {
                return '<div class="mermaid">' + code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').trim() + '</div>';
            });
            return html;
        }

        // Fix common Mermaid syntax errors from LLM output
        function fixMermaidSyntax(src) {
            var lines = src.split('\n');
            var result = [];
            var inSubgraph = [];

            // Pre-process: replace <br> tags with \n
            src = src.replace(/<br\/?>/gi, '\\n');
            lines = src.split('\n');

            for (var j = 0; j < lines.length; j++) {
                var line = lines[j];
                var trimmed = line.trim();

                if (!trimmed) { result.push(line); continue; }

                // Stop at non-graph content
                if (/^###/.test(trimmed) || /^## /.test(trimmed) || /^# /.test(trimmed)) break;
                if (/^\[/.test(trimmed) && (/来源/.test(trimmed) || /wiki\//.test(trimmed))) break;
                if (/^\*\*/.test(trimmed) || /^\d+\./.test(trimmed) || /^[-*] /.test(trimmed)) break;
                if (/^\[\[/.test(trimmed)) break;

                // Skip comments
                if (/^%%/.test(trimmed)) { result.push(line); continue; }

                // Remove v11+ features that v10 doesn't support
                if (/^direction\s+(TB|BT|LR|RL)/i.test(trimmed)) continue;
                if (/^classDef\b/.test(trimmed)) continue;
                // Also remove class lines that reference classDef names (v10 style issue)
                if (/^class\b/.test(trimmed)) continue;

                // Track subgraph nesting
                if (/^subgraph\b/.test(trimmed)) {
                    // Fix: subgraph ID [Label (text)] → subgraph ID [Label text]
                    // Parentheses inside [] confuse v10 parser (shape detection)
                    if (/\[.*\(/.test(trimmed)) {
                        line = line.replace(/\(/g, '').replace(/\)/g, '');
                        trimmed = line.trim();
                    }
                    inSubgraph.push(trimmed);
                    result.push(line);
                    continue;
                }
                if (trimmed === 'end') {
                    if (inSubgraph.length > 0) inSubgraph.pop();
                    result.push(line);
                    continue;
                }

                // Fix [ ... ) -> [ ... ]  (AI typo)
                var openB = (trimmed.match(/\[/g) || []).length;
                var closeB = (trimmed.match(/\]/g) || []).length;
                var openP = (trimmed.match(/\(/g) || []).length;
                var closeP = (trimmed.match(/\)/g) || []).length;
                if (openB > closeB && closeP > openP) {
                    var diff = openB - closeB;
                    for (var r = 0; r < diff; r++) {
                        var idx = line.lastIndexOf(')');
                        if (idx >= 0) line = line.substring(0, idx) + ']' + line.substring(idx + 1);
                    }
                }

                // Skip truncated lines
                var qCount = (line.match(/"/g) || []).length;
                if (qCount % 2 !== 0) continue;
                var netB = openB - ((line.match(/\]/g) || []).length);
                if (netB > 0 && !/subgraph/.test(trimmed)) continue;

                result.push(line);
            }

            // Close unclosed subgraphs
            while (inSubgraph.length > 0) {
                inSubgraph.pop();
                result.push(' end');
            }

            while (result.length > 0 && result[result.length - 1].trim() === '') {
                result.pop();
            }

            return result.join('\n');
        }

        // Wrap mermaid SVG with zoom/pan controls
        function wrapMermaidWithZoom(el) {
            var svg = el.querySelector('svg');
            if (!svg) return;

            // Add initial viewBox and style if not present
            if (!svg.getAttribute('viewBox')) {
                svg.setAttribute('viewBox', '0 0 800 600');
            }

            // Create wrapper
            var wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:relative;overflow:hidden;border-radius:8px;background:var(--bg-card, #1a1a2e);cursor:grab;';
            wrapper.className = 'mermaid-zoom-wrapper';

            // Create viewport
            var viewport = document.createElement('div');
            viewport.style.cssText = 'transform-origin:0 0;transition:transform 0.15s ease-out;';
            viewport.className = 'mermaid-zoom-viewport';

            // Move SVG into viewport
            svg.style.maxWidth = '100%';
            svg.style.height = 'auto';
            viewport.appendChild(svg);

            // Create controls
            var controls = document.createElement('div');
            controls.style.cssText = 'position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:10;';
            var btnStyle = 'width:28px;height:28px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg-card);color:var(--accent);opacity:0.9;font-size:16px;';
            var resetBtnStyle = btnStyle.replace('font-size:16px','font-size:12px');
            var fsBtnStyle = btnStyle.replace('font-size:16px','font-size:14px');
            controls.innerHTML =
                '<button class="mermaid-zoom-btn" data-zoom="in" title="放大" style="'+btnStyle+'">+</button>' +
                '<button class="mermaid-zoom-btn" data-zoom="out" title="缩小" style="'+btnStyle+'">−</button>' +
                '<button class="mermaid-zoom-btn" data-zoom="reset" title="重置" style="'+resetBtnStyle+'">⟲</button>' +
                '<button class="mermaid-zoom-btn" data-zoom="fullscreen" title="全屏" style="'+fsBtnStyle+'">⛶</button>';

            wrapper.appendChild(controls);
            wrapper.appendChild(viewport);

            // Create fullscreen modal
            var modal = document.createElement('div');
            modal.style.cssText = 'display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:99999;justify-content:center;align-items:center;';
            modal.className = 'mermaid-fullscreen-modal';
            modal.innerHTML =
                '<div style="position:absolute;top:12px;right:16px;z-index:10;display:flex;gap:8px;">' +
                    '<button class="mermaid-zoom-btn" data-zoom="in" title="放大" style="width:36px;height:36px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:var(--bg-card);color:var(--accent);opacity:0.95;font-size:20px;display:flex;align-items:center;justify-content:center;">+</button>' +
                    '<button class="mermaid-zoom-btn" data-zoom="out" title="缩小" style="width:36px;height:36px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:var(--bg-card);color:var(--accent);opacity:0.95;font-size:20px;display:flex;align-items:center;justify-content:center;">−</button>' +
                    '<button class="mermaid-zoom-btn" data-zoom="reset" title="重置" style="width:36px;height:36px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:var(--bg-card);color:var(--accent);opacity:0.95;font-size:16px;display:flex;align-items:center;justify-content:center;">⟲</button>' +
                    '<button class="mermaid-zoom-btn" data-zoom="close" title="关闭" style="width:36px;height:36px;border-radius:6px;cursor:pointer;border:1px solid #dc2626;background:#dc2626;color:#fff;opacity:0.95;font-size:18px;display:flex;align-items:center;justify-content:center;">✕</button>' +
                '</div>' +
                '<div class="mermaid-fullscreen-viewport" style="width:95%;height:90%;overflow:hidden;cursor:grab;position:relative;">' +
                    '<div class="mermaid-fullscreen-content" style="transform-origin:center center;transition:transform 0.15s ease-out;display:flex;justify-content:center;align-items:center;height:100%;"></div>' +
                '</div>';
            document.body.appendChild(modal);

            // Replace el contents with wrapper
            el.innerHTML = '';
            el.appendChild(wrapper);
            el.classList.add('mermaid-rendered');
            el.classList.add('mermaid-zoomable');

            // Zoom state (shared between inline and fullscreen)
            var scale = 1;
            var panX = 0;
            var panY = 0;
            var isDragging = false;
            var startX, startY;

            function updateTransform() {
                viewport.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
            }

            function setScale(newScale, cx, cy) {
                newScale = Math.max(0.1, Math.min(5, newScale));
                // Zoom toward center of visible area
                var rect = wrapper.getBoundingClientRect();
                var zoomX = cx !== undefined ? cx - rect.left : rect.width / 2;
                var zoomY = cy !== undefined ? cy - rect.top : rect.height / 2;

                panX = zoomX - (zoomX - panX) * (newScale / scale);
                panY = zoomY - (zoomY - panY) * (newScale / scale);
                scale = newScale;
                updateTransform();
            }

            // Button controls (inline)
            controls.addEventListener('click', function(e) {
                var btn = e.target.closest('.mermaid-zoom-btn');
                if (!btn) return;
                e.stopPropagation();
                var action = btn.getAttribute('data-zoom');
                if (action === 'in') setScale(scale * 1.3);
                else if (action === 'out') setScale(scale / 1.3);
                else if (action === 'reset') { scale = 1; panX = 0; panY = 0; updateTransform(); }
                else if (action === 'fullscreen') openFullscreen();
            });

            // Open fullscreen modal
            function openFullscreen() {
                var fsViewport = modal.querySelector('.mermaid-fullscreen-viewport');
                var fsContent = modal.querySelector('.mermaid-fullscreen-content');
                modal.style.display = 'flex';
                // Clone SVG
                var svgClone = svg.cloneNode(true);
                svgClone.style.maxWidth = 'none';
                svgClone.style.maxHeight = 'none';
                svgClone.style.width = 'auto';
                svgClone.style.height = 'auto';
                fsContent.innerHTML = '';
                fsContent.appendChild(svgClone);
                // Reset zoom for fullscreen
                scale = 1; panX = 0; panY = 0;
                fsContent.style.transform = '';
            }

            // Fullscreen modal controls
            modal.addEventListener('click', function(e) {
                var btn = e.target.closest('.mermaid-zoom-btn');
                if (!btn) return;
                e.stopPropagation();
                var action = btn.getAttribute('data-zoom');
                var fsViewport = modal.querySelector('.mermaid-fullscreen-viewport');
                var fsContent = modal.querySelector('.mermaid-fullscreen-content');
                if (action === 'close') {
                    modal.style.display = 'none';
                    return;
                }
                if (action === 'in') {
                    scale = Math.min(5, scale * 1.3);
                    fsContent.style.transform = 'scale(' + scale + ')';
                } else if (action === 'out') {
                    scale = Math.max(0.1, scale / 1.3);
                    fsContent.style.transform = 'scale(' + scale + ')';
                } else if (action === 'reset') {
                    scale = 1; panX = 0; panY = 0;
                    fsContent.style.transform = '';
                }
            });

            // ESC to close fullscreen
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.style.display === 'flex') {
                    modal.style.display = 'none';
                }
            });

            // Click background to close
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.style.display = 'none';
            });

            // Fullscreen wheel zoom
            var fsViewport = modal.querySelector('.mermaid-fullscreen-viewport');
            var fsContent = modal.querySelector('.mermaid-fullscreen-content');
            fsViewport.addEventListener('wheel', function(e) {
                e.preventDefault();
                var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                scale = Math.max(0.1, Math.min(5, scale * factor));
                fsContent.style.transform = 'scale(' + scale + ')';
            }, { passive: false });

            // Fullscreen drag to pan
            fsViewport.addEventListener('mousedown', function(e) {
                if (e.target.closest('.mermaid-zoom-btn')) return;
                if (scale <= 1.05) return;
                var fsStartX = e.clientX - panX;
                var fsStartY = e.clientY - panY;
                fsViewport.style.cursor = 'grabbing';
                e.preventDefault();
                function fsDrag(e2) {
                    panX = e2.clientX - fsStartX;
                    panY = e2.clientY - fsStartY;
                    fsContent.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
                }
                function fsEnd() {
                    fsViewport.style.cursor = 'grab';
                    document.removeEventListener('mousemove', fsDrag);
                    document.removeEventListener('mouseup', fsEnd);
                }
                document.addEventListener('mousemove', fsDrag);
                document.addEventListener('mouseup', fsEnd);
            });

            // Mouse drag to pan
            wrapper.addEventListener('mousedown', function(e) {
                if (e.target.closest('.mermaid-zoom-btn')) return;
                if (scale <= 1.05) return; // Only allow drag when zoomed in
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
                wrapper.style.cursor = 'grabbing';
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    wrapper.style.cursor = 'grab';
                }
            });

            // Mouse wheel zoom
            wrapper.addEventListener('wheel', function(e) {
                if (scale <= 0.1 && e.deltaY > 0) return;
                if (scale >= 5 && e.deltaY < 0) return;
                e.preventDefault();
                var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                setScale(scale * factor, e.clientX, e.clientY);
            }, { passive: false });
        }

        // Render all mermaid diagrams on page load
        var mermaidTimer = null;
        async function renderMermaidDiagrams() {
            var blocks = document.querySelectorAll('.mermaid:not(.mermaid-rendered)');
            if (!blocks.length) return;
            if (!window.mermaid) { console.log('[mermaid] not loaded yet'); return; }
            console.log('[mermaid] found', blocks.length, 'blocks to render');
            for (var i = 0; i < blocks.length; i++) {
                var el = blocks[i];
                // Decode HTML entities
                var tmp = document.createElement('textarea');
                tmp.innerHTML = el.innerHTML;
                var graphDef = tmp.value.trim();
                // Also try textContent as fallback
                if (!graphDef) graphDef = (el.textContent || el.innerText || '').trim();
                if (!graphDef) continue;
                
                // Fix common LLM syntax errors before rendering
                graphDef = fixMermaidSyntax(graphDef);
                
                console.log('[mermaid] block', i, 'len=', graphDef.length, 'preview=', graphDef.substring(0, 150));
                try {
                    var svgId = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                    var result = await mermaid.render(svgId, graphDef);
                    el.innerHTML = result.svg;
                    // Add zoom/pan controls
                    wrapMermaidWithZoom(el);
                    console.log('[mermaid] rendered ok');
                } catch(e) {
                    console.warn('[mermaid] render error:', e.message);
                    console.warn('[mermaid] graphDef:', graphDef);
                    // Show error in DOM so user can see it
                    var safeMsg = String(e.message || '').replace(/</g, '&lt;');
                    var safeGraph = String(graphDef || '').replace(/</g, '&lt;');
                    el.innerHTML = '<div style="color:var(--error-text, #ef9a9a);padding:8px;border:1px solid var(--error-border, #ef9a9a);border-radius:8px;font-size:13px;" class="mermaid-error">'
                        + '<b>Mermaid 渲染失败</b><br>' + safeMsg
                        + '<br><details><summary>查看图定义</summary><pre style="white-space:pre-wrap;font-size:12px;">' + safeGraph + '</pre></details></div>';
                    el.classList.add('mermaid-rendered');
                }
            }
        }
        // Check periodically for new mermaid blocks (for streaming chat)
        setInterval(function() {
            if (window.mermaid) renderMermaidDiagrams();
        }, 2000);
    </script>

    <script>
        // Load mermaid from local static (Mermaid v10.9.1, self-contained)
        var mScript = document.createElement('script');
        mScript.src = '/static/mermaid.min.js';
        mScript.onerror = function() {
            console.log('Mermaid not available, graphs will show as source code');
        };
        mScript.onload = function() {
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
                // Render existing mermaid blocks immediately
                setTimeout(function() { if (window.mermaid) renderMermaidDiagrams(); }, 100);
            }
        };
        document.head.appendChild(mScript);
    </script>

    <script>
    // ===== Theme Toggle =====
    (function() {
        // Load saved theme or detect system preference
        var saved = localStorage.getItem('wiki_theme');
        var theme = saved;
        if (!theme) {
            // Follow system preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                theme = 'light';
            } else {
                theme = 'dark';
            }
        }
        document.documentElement.setAttribute('data-theme', theme);
        updateToggleIcon(theme);
        // Listen for system preference changes (only if user hasn't manually set)
        if (!saved && window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('wiki_theme')) {
                    var t = e.matches ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', t);
                    updateToggleIcon(t);
                }
            });
        }
    })();
    function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('wiki_theme', next);
        updateToggleIcon(next);
    }
    function updateToggleIcon(theme) {
        var btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
